<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <!-- subtle modern background -->
    <radialGradient id="bgGlow" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="55%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#00695c"/>
    </radialGradient>

    <!-- soft top-left sheen -->
    <linearGradient id="bgSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle inner ring -->
    <linearGradient id="innerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- base background -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGlow)"/>

  <!-- subtle sheen overlay -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgSheen)"/>

  <!-- hairline inner ring -->
  <rect x="40" y="40" width="432" height="432" rx="102"
        fill="none"
        stroke="url(#innerRing)"
        stroke-width="2"/>

  <!-- Loupe handle -->
  <line x1="284" y1="284" x2="390" y2="390"
        stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>

  <!-- Loupe lens ring -->
  <circle cx="208" cy="208" r="104"
          fill="none" stroke="#ffffff" stroke-width="34"/>

  <!-- Bits examined through the lens -->
  <rect x="171" y="171" width="30" height="30" rx="8" fill="#ffffff"/>
  <rect x="215" y="171" width="30" height="30" rx="8" fill="#ffffff"/>
  <rect x="171" y="215" width="30" height="30" rx="8" fill="#ffffff"/>
  <rect x="215" y="215" width="30" height="30" rx="8" fill="#ffffff"/>
</svg>